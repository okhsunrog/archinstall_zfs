[workspace]
members = ["core", "tui", "slint-ui", "xtask"]
exclude = ["third-party/aur-depends"]
resolver = "3"

[workspace.dependencies]
clap = { version = "4.6.5", features = ["derive"] }
color-eyre = "0.6.5"
futures = "0.3.33"
nix = { version = "0.31.3", features = ["fs"] }
nmrs = "3.4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sublime_fuzzy = "0.7.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zxcvbn = "3.1.1"
